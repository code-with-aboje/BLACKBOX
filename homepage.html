<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackBox — Vault</title>
<meta name="description" content="BlackBox — private APK vault.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #040605;
    --panel: #0a0f0c;
    --panel-raised: #0d1410;
    --line: #152019;
    --phosphor: #39ff8f;
    --phosphor-dim: #1c6b42;
    --phosphor-glow: rgba(57, 255, 143, 0.35);
    --text: #dcece2;
    --muted: #6d8177;
    --danger: #ff4d6d;
    --amber: #ffb454;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

 html, body {
  touch-action: pan-y;
}
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* faint background grid, consistent with the rest of the app */
  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: #0a0a0a;
  }

  /*  TOP STATUS STRIP  */
  .topbar {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: #0a0a0a;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.15em;
    letter-spacing: 1px;
  }

  .brand-mark .black { color: #cfd9d3; }
  .brand-mark .box { color: var(--phosphor); text-shadow: 0 0 12px var(--phosphor-glow); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7em;
    letter-spacing: 1px;
    color: var(--phosphor);
    border: 1px solid var(--phosphor-dim);
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(57,255,143,0.06);
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--phosphor);
    box-shadow: 0 0 6px var(--phosphor);
    animation: dotPulse 2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .token-readout {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-raised);
    font-size: 0.8em;
  }

  .token-readout .value {
    color: var(--phosphor);
    font-weight: 700;
  }

  .token-readout .unit {
    color: var(--muted);
    font-size: 0.85em;
  }

  .menu-btn {
    display: none;
    width: 34px; height: 34px;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 1.1em;
  }

  /* SHELL LAYOUT */
  .shell {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* MANIFEST (SIDEBAR) */
  .manifest {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .manifest-heading {
    padding: 16px 18px 8px;
    font-size: 0.65em;
    letter-spacing: 3px;
    color: var(--muted);
  }

  .manifest-list {
    display: flex;
    flex-direction: column;
    padding: 0 10px;
    gap: 2px;
  }

  .manifest-list label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
    font-size: 0.82em;
    letter-spacing: 0.5px;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .manifest-list label:hover {
    background: rgba(255,255,255,0.03);
    border-color: var(--line);
  }

  .manifest-list .addr {
    color: var(--muted);
    font-size: 0.9em;
    min-width: 34px;
  }

  .manifest-list .name {
    flex: 1;
  }

  .manifest-list .count {
    font-size: 0.75em;
    color: var(--bg);
    background: var(--phosphor);
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 700;
  }

  .manifest-divider {
    height: 1px;
    background: var(--line);
    margin: 12px 16px;
  }

  .manifest-list label.danger .addr,
  .manifest-list label.danger .name {
    color: var(--danger);
  }

  /* VAULT VIEWPORT (main / CRT bezel)  */
  .viewport-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 1px;
    min-width: 0;
    overflow: hidden;
  }

  .crt-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px 12px;
  }

  .crt-title {
    font-size: 0.78em;
    letter-spacing: 2px;
    color: var(--phosphor);
    text-shadow: 0 0 8px var(--phosphor-glow);
  }

  .panel {
    display: none;
    width: 100%;
    flex: 1;
    min-height: 0;
    border: none;
    background: #0a0a0a;
  }

  .panel-placeholder {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.8em;
    letter-spacing: 1px;
    text-align: center;
    padding: 20px;
  }

  .panel-placeholder .code {
    color: var(--phosphor);
    font-size: 1.6em;
    font-weight: 700;
  }

  /*  MOBILE TAB BAR  */
  .tabbar {
    display: none;
    position: fixed;
    bottom: 0; left: 0;
    width: 100%;
    z-index: 20;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: #0a0a0a;
    border-top: 1px solid var(--line);
    backdrop-filter: blur(10px);
  }

  .tabbar-inner {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    background: rgba(255, 255, 255, 0.03);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    border-radius: 13px;
    padding: 8px 4px;
  }

  .tabbar label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 10px;
    border-radius: 12px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.62em;
    letter-spacing: 0.5px;
  }

  .tabbar label svg { width: 20px; height: 20px; }

  /* SIDEBAR OVERLAY (mobile) */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 14;
  }

  /* module -> panel wiring (one radio id per panel id, no duplicates) */
  #mod-market:checked  ~ .shell #panel-market,
  #mod-uploads:checked ~ .shell #panel-uploads,
  #mod-blip:checked    ~ .shell #panel-blip,
  #mod-users:checked   ~ .shell #panel-users,
  #mod-chats:checked   ~ .shell #panel-chats,
  #mod-events:checked  ~ .shell #panel-events,
  #mod-topup:checked   ~ .shell #panel-topup,
  #mod-ledger:checked  ~ .shell #panel-ledger,
  #mod-alerts:checked  ~ .shell #panel-alerts,
  #mod-gifting:checked ~ .shell #panel-gifting,
  #mod-profile:checked ~ .shell #panel-profile {
    display: block;
  }

  body:has(#mod-market:checked)   [for="mod-market"],
  body:has(#mod-uploads:checked)  [for="mod-uploads"],
  body:has(#mod-blip:checked)     [for="mod-blip"],
  body:has(#mod-users:checked)    [for="mod-users"],
  body:has(#mod-chats:checked)    [for="mod-chats"],
  body:has(#mod-events:checked)   [for="mod-events"],
  body:has(#mod-topup:checked)    [for="mod-topup"],
  body:has(#mod-ledger:checked)   [for="mod-ledger"],
  body:has(#mod-alerts:checked)   [for="mod-alerts"],
  body:has(#mod-gifting:checked)  [for="mod-gifting"],
  body:has(#mod-profile:checked)  [for="mod-profile"] {
    background: rgba(57,255,143,0.08);
    border-color: var(--phosphor-dim);
    color: var(--phosphor);
  }

  /* mobile sidebar open/close */
  body:has(#sidebar-toggle:checked) .manifest {
    left: 0 !important;
  }
  body:has(#sidebar-toggle:checked) .sidebar-overlay {
    display: block;
  }
  /* .shell (z-index:2) creates its own stacking context, which traps .manifest's
     z-index:15 inside it — so .manifest was never actually able to out-rank the
     overlay's z-index:14 sitting outside .shell. Bump .shell above the overlay
     only while the drawer is open, so taps land on the menu, not the overlay. */
  body:has(#sidebar-toggle:checked) .shell {
    position: relative;
    z-index: 16;
  }

  /* media queries on screen sizes */
  @media (max-width: 780px) {
    .menu-btn { display: flex; }
  

    .manifest {
      position: fixed;
      top: 0; left: -280px;
      height: 100vh;
      width: 240px;
      z-index: 15;
      transition: left 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    }

    .viewport-wrap {
      padding: 14px;
      padding-bottom: 110px;
    }

    .tabbar { display: block; }

    #manifest{
      padding-top: 18%;
    }

     #web_profile, .svg{
      display: none;
    }
  }



</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  // ---- AUTH GUARD: must run before anything else on the page ----
  // If there's no logged-in Supabase session, send them to login immediately.
  let currentUser = null;

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = 'login/login.html';
      return; // stop here, nothing below should run for a logged-out visitor
    }

    currentUser = session.user;

    // Now that we know who's logged in, load the stuff that depends on it.
    refreshTokenBalance();
    refreshNotifBadge();
  })();

  // Nav is otherwise pure CSS (radio buttons), but the mobile drawer needs one
  // bit of behavior CSS can't do: close itself once you've picked something,
  // so the panel you just switched to is actually visible.
  document.querySelectorAll('.manifest-list label').forEach(label => {
    label.addEventListener('click', () => {
      document.getElementById('sidebar-toggle').checked = false;
    });
  });

  // Lazy-load panels: don't fetch a panel's iframe content until its tab is
  // actually selected. Without this, every refresh fired off all 12 panel
  // requests at once — including several that don't have pages built yet,
  // which just 404'd every single time and slowed the page down for nothing.
  const panelLabels = {
    'mod-market': 'MARKET',
    'mod-uploads': 'UPLOADS',
    'mod-blip': 'BLIP',
    'mod-users': 'USERS',
    'mod-chats': 'CHATS',
    'mod-events': 'THE GRID',
    'mod-topup': 'TOP UP',
    'mod-ledger': 'TRANSACTIONS',
    'mod-alerts': 'NOTIFICATIONS',
    'mod-gifting': 'GIFTING',
    'mod-profile': 'PROFILE'
  };
  const bannerEl = document.getElementById('banner');

  function loadPanelFor(radio) {
    // GRID is a full-screen experience, not a dashboard panel — leave the shell entirely
    if (radio.id === 'mod-events') {
        window.location.href = 'orientationCheck.html';
        return;
    }

    const panelId = 'panel-' + radio.id.replace('mod-', '');
    const iframe = document.getElementById(panelId);
    if (iframe && !iframe.src && iframe.dataset.src) {
        iframe.src = iframe.dataset.src;
    }
    if (bannerEl && panelLabels[radio.id]) {
        bannerEl.textContent = panelLabels[radio.id];
    }
}

  document.querySelectorAll('input[name="module"]').forEach(radio => {
    radio.addEventListener('change', () => { if (radio.checked) loadPanelFor(radio); });
  });

  // load whichever tab is checked by default on first page load
  const initiallyChecked = document.querySelector('input[name="module"]:checked');
  if (initiallyChecked) loadPanelFor(initiallyChecked);

  // ---- Token balance readout ----
  // Reads straight from the profiles table now instead of api/balance.php.
  const tokenValueEl = document.getElementById('tokenValue');

  async function refreshTokenBalance() {
    if (!currentUser || !tokenValueEl) return;
    try {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('tokens')
        .eq('id', currentUser.id)
        .single();

      if (!error && data) {
        tokenValueEl.textContent = data.tokens.toLocaleString();
      }
    } catch (e) { /* leave last known value on screen */ }
  }

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'bb-tokens-changed') {
      refreshTokenBalance();
    }
    if (e.data && e.data.type === 'bb-notifications-changed') {
      updateNotifBadge(e.data.unread_count);
    }
  });

  // ---- Notifications badge ----
  // Reads straight from the notifications table 

  const notifCountEl = document.getElementById('notifCount');
  function updateNotifBadge(count) {
    if (!notifCountEl) return;
    if (count > 0) {
      notifCountEl.textContent = count > 99 ? '99+' : count;
      notifCountEl.style.display = 'inline-block';
    } else {
      notifCountEl.style.display = 'none';
    }
  }
  async function refreshNotifBadge() {
    if (!currentUser) return;
    try {
      const { count, error } = await supabaseClient
        .from('notifications')
        .select('id', { count: 'exact', head: true })
        .eq('user_id', currentUser.id)
        .eq('is_read', false);

      if (!error) updateNotifBadge(count || 0);
    } catch (e) { /* leave badge as-is */ }
  }
</script>
