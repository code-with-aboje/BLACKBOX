<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackBox — Entering Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* ===== ROTATE PROMPT ===== */
  .rotate-icon {
    width: 64px; height: 64px; border: 2px solid #00ff8c; border-radius: 8px;
    margin: 0 auto 20px; animation: rotateHint 1.6s ease-in-out infinite;
    box-shadow: 0 0 14px rgba(0,255,140,0.4);
  }
  @keyframes rotateHint { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  #rotateScreen h1 { font-size: 1.1em; letter-spacing: 1px; margin-bottom: 8px; }
  #rotateScreen p { color: #888; font-size: 0.85em; }

  /* ===== SCI-FI LOADING ===== */
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 38px 38px;
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    pointer-events: none;
  }

  .spinner-rig { position: relative; width: 84px; height: 84px; opacity: 0; }
  .spinner-rig.armed { opacity: 1; transition: opacity 0.25s ease; }

  .spin-ring { position: absolute; border-radius: 50%; border: 2px solid transparent; animation-play-state: paused; }
  .spin-ring.r1 { inset: 0; border-top-color: #ffffff; border-right-color: rgba(0,255,140,0.35); animation: spinCW 1.1s linear infinite; }
  .spin-ring.r2 { inset: 14px; border-bottom-color: #00ff8c; border-left-color: rgba(255,255,255,0.12); animation: spinCCW 0.85s linear infinite; }
  .spin-ring.r3 { inset: 28px; border: 1px solid rgba(0,255,140,0.25); }

  .tick, .tick2 { position: absolute; inset: 0; animation: spinCW 6s linear infinite; animation-play-state: paused; }
  .tick::before, .tick::after, .tick2::before, .tick2::after {
    content: ''; position: absolute; width: 2px; height: 6px; background: rgba(0,255,140,0.55);
  }
  .tick::before { top: -3px; left: 50%; transform: translateX(-50%); }
  .tick::after { bottom: -3px; left: 50%; transform: translateX(-50%); }
  .tick2::before { top: 50%; left: -3px; transform: translateY(-50%) rotate(90deg); }
  .tick2::after { top: 50%; right: -3px; transform: translateY(-50%) rotate(90deg); }

  .spinner-core {
    position: absolute; inset: 34px; border-radius: 50%; background: #ffffff;
    box-shadow: 0 0 12px 3px rgba(0,255,140,0.55);
    animation: pulseCore 1.4s ease-in-out infinite; animation-play-state: paused;
  }

  .spinner-rig.running .spin-ring,
  .spinner-rig.running .tick,
  .spinner-rig.running .tick2,
  .spinner-rig.running .spinner-core { animation-play-state: running; }

  @keyframes spinCW { to { transform: rotate(360deg); } }
  @keyframes spinCCW { to { transform: rotate(-360deg); } }
  @keyframes pulseCore { 0%, 100% { opacity: 0.5; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }

  .loading-text {
    margin-top: 26px; color: #aaa; font-size: 0.85em; font-weight: 600;
    letter-spacing: 1.5px; text-align: center; position: relative; z-index: 1;
  }

  .loading-bar-wrap { margin-top: 22px; width: 220px; position: relative; z-index: 1; }
  .loading-bar-track { display: flex; gap: 3px; height: 8px; }
  .loading-bar-seg {
    flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(0,255,140,0.15);
    clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .loading-bar-seg.lit { background: #00ff8c; box-shadow: 0 0 8px 1px rgba(0,255,140,0.7); border-color: #00ff8c; }
  .loading-bar-pct { margin-top: 8px; font-size: 0.7em; letter-spacing: 2px; color: #00ff8c; text-align: right; }

  @media (prefers-reduced-motion: reduce) {
    .spin-ring, .tick, .tick2, .spinner-core, .rotate-icon { animation: none; }
  }
</style>
</head>
<body>

  <!-- SCREEN 1: rotate prompt, shown while the phone is in portrait -->
  <div class="screen active" id="rotateScreen">
    <div class="rotate-icon"></div>
    <h1>Rotate Your Device</h1>
    <p>This experience is built for landscape mode.</p>
  </div>

  <!-- SCREEN 2: sci-fi loading rig, shown once landscape is confirmed -->
  <div class="screen" id="loadingScreen">
    <div class="spinner-rig" id="loadingSpinner">
      <div class="tick"></div>
      <div class="tick2"></div>
      <div class="spin-ring r1"></div>
      <div class="spin-ring r2"></div>
      <div class="spin-ring r3"></div>
      <div class="spinner-core"></div>
    </div>
    <div class="loading-text">Loading</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar-track" id="loadingBarTrack"></div>
      <div class="loading-bar-pct" id="loadingBarPct">0%</div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const target = params.get('to') || 'Game/lobby.html';

  const rotateScreen = document.getElementById('rotateScreen');
  const loadingScreen = document.getElementById('loadingScreen');
  const rig = document.getElementById('loadingSpinner');

  let hasStartedLoading = false;

  // ---- Segmented progress bar setup ----
  const SEGMENT_COUNT = 18;
  const barTrack = document.getElementById('loadingBarTrack');
  for (let i = 0; i < SEGMENT_COUNT; i++) {
    const seg = document.createElement('div');
    seg.className = 'loading-bar-seg';
    barTrack.appendChild(seg);
  }
  const segments = barTrack.querySelectorAll('.loading-bar-seg');
  const barPct = document.getElementById('loadingBarPct');

  function setProgress(pct) {
    const clamped = Math.max(0, Math.min(100, pct));
    const litCount = Math.round((clamped / 100) * SEGMENT_COUNT);
    segments.forEach((seg, i) => seg.classList.toggle('lit', i < litCount));
    barPct.textContent = Math.round(clamped) + '%';
  }

  // ---- TEMPORARY: fixed-time loading ----
  // No real assets to preload yet (character models etc. aren't built).
  // Runs the bar up over a fixed duration instead. Once real models/assets
  // exist, swap this block back for the fetch()-based preloadAssets version.
  const LOAD_DURATION_MS = 8000;

  function startLoadingSequence() {
    if (hasStartedLoading) return;
    hasStartedLoading = true;

    rotateScreen.classList.remove('active');
    loadingScreen.classList.add('active');

    requestAnimationFrame(() => rig.classList.add('armed'));
    setTimeout(() => rig.classList.add('running'), 500);

    const start = performance.now();
    function tick(now) {
      const elapsed = now - start;
      const pct = Math.min(100, (elapsed / LOAD_DURATION_MS) * 100);
      setProgress(pct);
      if (pct < 100) {
        requestAnimationFrame(tick);
      } else {
        setTimeout(() => window.location.replace(target), 300);
      }
    }
    requestAnimationFrame(tick);
  }

  function checkOrientation() {
    const isLandscape = window.matchMedia('(orientation: landscape)').matches;
    if (isLandscape) startLoadingSequence();
  }

  checkOrientation();
  window.addEventListener('resize', checkOrientation);
  screen.orientation?.addEventListener('change', checkOrientation);
</script>

</body>
</html>
