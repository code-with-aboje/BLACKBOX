<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackBox — Entering Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  .rotate-icon {
    width: 64px; height: 64px; border: 2px solid #00ff8c; border-radius: 8px;
    margin: 0 auto 20px; animation: rotateHint 1.6s ease-in-out infinite;
    box-shadow: 0 0 14px rgba(0,255,140,0.4);
  }
  @keyframes rotateHint { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  h1 { font-size: 1.1em; letter-spacing: 1px; margin-bottom: 8px; }
  p { color: #888; font-size: 0.85em; }

  @media (prefers-reduced-motion: reduce) {
    .rotate-icon { animation: none; }
  }
</style>
</head>
<body>

  <div id="rotateScreen">
    <div class="rotate-icon"></div>
    <h1>Rotate Your Device</h1>
    <p>This experience is built for landscape mode.</p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const target = params.get('to') || 'Game/lobby.html';

  let redirected = false;

  function checkOrientation() {
    const isLandscape = window.matchMedia('(orientation: landscape)').matches;
    if (isLandscape && !redirected) {
      redirected = true;
      // tiny delay lets the orientation reading settle before navigating,
      // avoids bouncing straight back due to a stale reading
      setTimeout(() => window.location.replace(target), 200);
    }
  }

  checkOrientation();
  window.addEventListener('resize', checkOrientation);
  screen.orientation?.addEventListener('change', checkOrientation);
</script>

</body>
</html>
