<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign Up - BlackBox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background elements */
    .bg-gradient {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }

    .bg-gradient-1 {
      background: linear-gradient(135deg, #3a3a3a, #1a1a1a);
      top: -200px;
      left: -200px;
      animation-delay: 0s;
    }

    .bg-gradient-2 {
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      bottom: -200px;
      right: -200px;
      animation-delay: 10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(100px, -100px) scale(1.1); }
      66% { transform: translate(-50px, 100px) scale(0.9); }
    }

    .container {
      max-width: 480px;
      width: 100%;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .signup-card {
      background: linear-gradient(135deg, #1a1a1a, #141414);
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 50px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      animation: slideUp 0.6s ease-out;
      overflow: hidden;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      border: 2px solid #3a3a3a;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }
    .logo:hover { transform: scale(1.05); }

    .logo svg {
      width: 40px;
      height: 40px;
      color: #888;
    }

    .logo-section h1 {
      font-size: 2em;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .logo-section p {
      color: #888;
      font-size: 0.95em;
      font-weight: 500;
    }

    /* Progress dots */
    .progress-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: all 0.35s cubic-bezier(0.65,0,0.35,1);
      transform: scale(1);
    }
    .dot.active {
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.12);
      transform: scale(1.25);
    }
    .dot.done {
      background: #777;
    }

    /* Staggered entrance animation for step contents */
    @keyframes slideUpIn {
      from { transform: translateY(22px); }
      to   { transform: translateY(0); }
    }
    .anim-item {
      animation: slideUpIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* Sliding step track */
    .step-viewport {
      overflow: hidden;
      position: relative;
    }
    .step-track {
      display: flex;
      width: 300%;
      transition: transform 0.55s cubic-bezier(0.65,0,0.35,1);
    }
    .step-panel {
      width: 33.3333%;
      flex-shrink: 0;
      padding: 2px;
    }

    .form-group { margin-bottom: 22px; }

    .form-label {
      display: block;
      color: #888;
      font-weight: 600;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      pointer-events: none;
    }
    .input-icon svg { width: 20px; height: 20px; }

    .form-input {
      width: 100%;
      padding: 16px 18px 16px 50px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1em;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.05);
      border-color: #4a4a4a;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }
    .form-input::placeholder { color: #555; }

    .toggle-password {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 4px;
      transition: color 0.3s ease;
    }
    .toggle-password:hover { color: #888; }
    .toggle-password svg { width: 20px; height: 20px; }

    .primary-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ffffff, #e0e0e0);
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: 700;
      font-size: 1em;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
    }
    .primary-btn:hover {
      background: linear-gradient(135deg, #ffffff, #f5f5f5);
      box-shadow: 0 6px 24px rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    .primary-btn:active { transform: translateY(0); }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .secondary-btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #aaa;
      font-weight: 700;
      font-size: 1em;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    .secondary-btn:hover {
      border-color: #4a4a4a;
      color: #fff;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }
    .btn-row .secondary-btn { flex: 0 0 34%; }
    .btn-row .primary-btn { flex: 1; }
    .btn-row .primary-btn,
    .btn-row .secondary-btn {
      font-size: 0.8em;
      letter-spacing: 0.5px;
      padding: 14px 8px;
      white-space: nowrap;
    }

    /* Avatar picker */
    .avatar-preview-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }
    .avatar-preview {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
      border: 2px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #666;
      overflow: hidden;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .avatar-preview.filled {
      border-color: #4a4a4a;
      transform: scale(1.03);
    }
    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .avatar-option {
      aspect-ratio: 1;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #ccc;
    }
    .avatar-option:hover {
      border-color: #4a4a4a;
      background: rgba(255,255,255,0.05);
    }
    .avatar-option.selected {
      border-color: #ffffff;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
      transform: scale(1.05);
    }

    .upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 1px dashed #333;
      border-radius: 12px;
      color: #888;
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 24px;
    }
    .upload-label:hover {
      border-color: #4a4a4a;
      color: #ccc;
      background: rgba(255,255,255,0.02);
    }
    .upload-label svg { width: 16px; height: 16px; }
    #galleryInput { display: none; }

    /* Role picker */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .role-option {
      padding: 14px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #ccc;
      font-size: 0.8em;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .role-option span { font-size: 18px; }
    .role-option:hover {
      border-color: #4a4a4a;
      background: rgba(255,255,255,0.05);
    }
    .role-option.selected {
      border-color: #ffffff;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0 20px;
      color: #666;
      font-size: 0.85em;
      font-weight: 500;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }
    .divider span { padding: 0 16px; }

    .signup-link {
      text-align: center;
      color: #888;
      font-size: 0.95em;
    }
    .signup-link a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.3s ease;
    }
    .signup-link a:hover { color: #cccccc; }

    .error-message {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: #ff6b6b;
      font-size: 0.9em;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.4s ease;
    }
    .error-message.show { display: block; }

    .success-message {
      background: rgba(0, 255, 127, 0.1);
      border: 1px solid rgba(0, 255, 127, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      color: #00ff7f;
      font-size: 0.9em;
      margin-bottom: 20px;
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .success-message.show { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ===== REUSABLE LOADING OVERLAY (copy this block too) ===== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .loading-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    .loading-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: loadingSpin 0.8s linear infinite;
    }
    @keyframes loadingSpin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      color: #aaa;
      font-family: 'Inter', sans-serif;
      font-size: 0.9em;
      font-weight: 600;
      letter-spacing: 1px;
      text-align: center;
    }
    .loading-success-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .loading-success-icon svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
    }
    @keyframes popIn {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    /* ===== END REUSABLE LOADING OVERLAY ===== */

    @media (max-width: 768px) {
      .signup-card { padding: 40px 30px; }
      .logo-section h1 { font-size: 1.8em; }
    }
    @media (max-width: 480px) {
      .container { padding: 15px; }
      .signup-card { padding: 35px 22px; border-radius: 20px; }
      .logo { width: 70px; height: 70px; }
      .logo svg { width: 35px; height: 35px; }
      .logo-section h1 { font-size: 1.6em; }
      .avatar-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="bg-gradient bg-gradient-1"></div>
  <div class="bg-gradient bg-gradient-2"></div>

  <div class="container">
    <div class="signup-card">

      <div class="logo-section">
        <div class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>BlackBox</h1>
        <p id="subtitle">Create your account to get started</p>
      </div>

      <div class="progress-dots">
        <span class="dot active" id="dot1"></span>
        <span class="dot" id="dot2"></span>
        <span class="dot" id="dot3"></span>
      </div>

      <div class="error-message" id="errorMessage">Please fill in all fields correctly</div>
      <div class="success-message" id="successMessage">✓ Account created! Redirecting...</div>

      <div class="step-viewport">
        <div class="step-track" id="stepTrack">

          <!-- STEP 1: ACCOUNT INFO -->
          <div class="step-panel" id="step1">
            <div class="form-group anim-item" style="animation-delay:0.05s">
              <label class="form-label" for="username">Username</label>
              <div class="input-wrapper">
                <div class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </div>
                <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
              </div>
            </div>

            <div class="form-group anim-item" style="animation-delay:0.12s">
              <label class="form-label" for="email">Email Address</label>
              <div class="input-wrapper">
                <div class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                  </svg>
                </div>
                <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
              </div>
            </div>

            <div class="form-group anim-item" style="animation-delay:0.19s">
              <label class="form-label" for="password">Password</label>
              <div class="input-wrapper">
                <div class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </div>
                <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required>
                <button type="button" class="toggle-password" id="togglePassword">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="button" class="primary-btn anim-item" style="animation-delay:0.26s" id="nextBtn1">Next</button>
          </div>

          <!-- STEP 2: AVATAR -->
          <div class="step-panel" id="step2">
            <div class="avatar-preview-wrap anim-item" style="animation-delay:0.05s">
              <div class="avatar-preview" id="avatarPreview">?</div>
            </div>

            <div class="form-group anim-item" style="animation-delay:0.12s">
              <label class="form-label">Choose an Avatar</label>
              <label class="upload-label" for="galleryInput">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Upload from gallery
              </label>
              <input type="file" id="galleryInput" accept="image/*">
            </div>

            <div class="btn-row anim-item" style="animation-delay:0.19s">
              <button type="button" class="secondary-btn" id="backBtn2">Back</button>
              <button type="button" class="primary-btn" id="nextBtn2">Next</button>
            </div>
          </div>

          <!-- STEP 3: ROLE -->
          <div class="step-panel" id="step3">
            <div class="form-group anim-item" style="animation-delay:0.05s">
              <label class="form-label">Pick a Role</label>
              <div class="role-grid" id="roleGrid"></div>
            </div>

            <div class="btn-row anim-item" style="animation-delay:0.12s">
              <button type="button" class="secondary-btn" id="backBtn3">Back</button>
              <button type="button" class="primary-btn" id="submitBtn">Create Account</button>
            </div>
          </div>

        </div>
      </div>

      <div class="divider"><span>OR</span></div>

      <div class="signup-link">
        Already have an account? <a href="login/login.html">Login</a>
      </div>
    </div>
  </div>

  <!-- ===== REUSABLE LOADING OVERLAY (copy this block too) ===== -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner" id="loadingSpinner"></div>
    <div class="loading-success-icon" id="loadingSuccessIcon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="loading-text" id="loadingText">Loading...</div>
  </div>
  <!-- ===== END REUSABLE LOADING OVERLAY ===== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    // ===== REUSABLE LOADING OVERLAY FUNCTIONS (copy this block too) =====
    function showLoadingOverlay(message = 'Loading...') {
      const overlay = document.getElementById('loadingOverlay');
      const text = document.getElementById('loadingText');
      const spinner = document.getElementById('loadingSpinner');
      const successIcon = document.getElementById('loadingSuccessIcon');
      if (!overlay) return;
      spinner.style.display = 'block';
      successIcon.style.display = 'none';
      if (text) text.textContent = message;
      overlay.classList.add('visible');
    }

    function showLoadingSuccess(message = 'Success!') {
      const spinner = document.getElementById('loadingSpinner');
      const successIcon = document.getElementById('loadingSuccessIcon');
      const text = document.getElementById('loadingText');
      spinner.style.display = 'none';
      successIcon.style.display = 'flex';
      // restart the pop-in animation
      successIcon.style.animation = 'none';
      void successIcon.offsetWidth;
      successIcon.style.animation = '';
      if (text) text.textContent = message;
    }

    function hideLoadingOverlay() {
      const overlay = document.getElementById('loadingOverlay');
      if (!overlay) return;
      overlay.classList.remove('visible');
    }
    // ===== END REUSABLE LOADING OVERLAY FUNCTIONS =====

    const userData = { username:'', email:'', password:'', avatar:'', role:'' };

    // Password toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      eyeIcon.innerHTML = type === 'text'
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });

    // Avatar - gallery upload only
    const avatarPreview = document.getElementById('avatarPreview');

    // Gallery upload
    const galleryInput = document.getElementById('galleryInput');
    galleryInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        userData.avatar = ev.target.result;
        avatarPreview.innerHTML = `<img src="${ev.target.result}" alt="avatar">`;
        avatarPreview.classList.add('filled');
      };
      reader.readAsDataURL(file);
    });

    // Role picker
    const roleOptions = [
      { label:'Web Dev', icon:'🌐' },
      { label:'App Dev', icon:'📱' },
      { label:'CyberSec', icon:'🛡' },
      { label:'Bot Dev', icon:'🤖' },
      { label:'Modder', icon:'🔧' },
      { label:'Member', icon:'👤' }
    ];
    const roleGrid = document.getElementById('roleGrid');
    roleOptions.forEach(r => {
      const btn = document.createElement('div');
      btn.className = 'role-option';
      btn.innerHTML = `<span>${r.icon}</span>${r.label}`;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
        btn.classList.add('selected');
        userData.role = r.label;
      });
      roleGrid.appendChild(btn);
    });

    // Step navigation
    const stepTrack = document.getElementById('stepTrack');
    const dots = [document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];
    const panels = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];
    const subtitle = document.getElementById('subtitle');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    const subtitles = [
      'Create your account to get started',
      'Choose how you want to be seen',
      'Almost done — pick your role'
    ];

    let currentStep = 0;

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 2500);
    }

    function replayAnimation(panel) {
      const items = panel.querySelectorAll('.anim-item');
      items.forEach(el => {
        el.style.animation = 'none';
        // force reflow so the animation restarts
        void el.offsetWidth;
        el.style.animation = '';
      });
    }

    function goToStep(index) {
      currentStep = index;
      stepTrack.style.transform = `translateX(-${index * (100 / 3)}%)`;

      dots.forEach((dot, i) => {
        dot.classList.remove('active', 'done');
        if (i < index) dot.classList.add('done');
        if (i === index) dot.classList.add('active');
      });

      subtitle.textContent = subtitles[index];
      replayAnimation(panels[index]);
    }

    document.getElementById('nextBtn1').addEventListener('click', () => {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!username) return showError('Please enter a username');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email');
      if (password.length < 6) return showError('Password must be at least 6 characters');

      userData.username = username;
      userData.email = email;
      userData.password = password;

      goToStep(1);
    });

    document.getElementById('nextBtn2').addEventListener('click', () => {
      if (!userData.avatar) return showError('Please choose or upload an avatar');
      goToStep(2);
    });

    document.getElementById('backBtn2').addEventListener('click', () => goToStep(0));
    document.getElementById('backBtn3').addEventListener('click', () => goToStep(1));

    document.getElementById('submitBtn').addEventListener('click', async () => {
      if (!userData.role) return showError('Please pick a role');

      // userData now holds: username, email, password, avatar, role
      showLoadingOverlay('Creating your account...');

      try {
        // username + role are passed as user_metadata — the trigger in
        // your teammate's schema (handle_new_user) reads these and creates
        // the matching row in public.profiles automatically.
        const { data, error } = await supabaseClient.auth.signUp({
          email: userData.email,
          password: userData.password,
          options: {
            data: {
              username: userData.username,
              role: userData.role
            }
          }
        });

        if (error) {
          hideLoadingOverlay();
          return showError(error.message || 'Signup failed');
        }

        // NOTE: avatar upload happens here (if a session already exists) or
        // right after the user's first login (if email confirmation delayed
        // the session) — see uploadPendingAvatarIfAny in supabase-client.js.
        if (userData.avatar) {
          localStorage.setItem('bb_pending_avatar', userData.avatar);
        }

        // If email confirmation is required, there's no session yet — sending
        // them to homepage.html would just bounce them back to login. Show a
        // "check your email" message instead, then send them to login once
        // they've actually confirmed.
        if (!data.session) {
          showLoadingSuccess('Account created!');
          const loadingText = document.getElementById('loadingText');
          if (loadingText) {
            loadingText.textContent = 'Check your email to confirm your account, then log in.';
          }
          setTimeout(() => {
            window.location.href = 'login/login.html';
          }, 3500);
          return;
        }

        // Email confirmation is off (or already confirmed) — there's a real
        // session already, safe to go straight in.
        if (userData.avatar) {
          await uploadPendingAvatarIfAny(data.user.id);
        }
        showLoadingSuccess('Account created!');
        setTimeout(() => {
          window.location.href = 'homepage.html';
        }, 1000);
      } catch (err) {
        hideLoadingOverlay();
        showError('Network error, please try again');
      }
    });

    // Play entrance animation for step 1 on initial load
    replayAnimation(panels[0]);
  </script>
</body>
</html>
