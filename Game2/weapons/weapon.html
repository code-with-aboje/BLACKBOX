<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weapons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --panel: rgba(36, 24, 18, 0.88);
    --panel-2: rgba(46, 33, 25, 0.92);
    --line: #4A2F22;
    --maroon: #6B1E1E;
    --amber: #F5943C;
    --amber-deep: #D9702A;
    --text: #F3E9DD;
    --text-dim: #B99C85;
    --text-faint: #7A5F4E;
}
*{ box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
html,body{ margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#0a0705; touch-action:none; overscroll-behavior:none; }

#scene-bg{
    position: fixed; inset:0;
    background: radial-gradient(120% 100% at 15% 0%, #241812 0%, #0a0705 60%);
    z-index:0;
}
#scene-bg::before{
    content:'';
    position:fixed; inset:0;
    background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 38px 38px;
    mask-image: radial-gradient(circle at 20% 10%, black 0%, transparent 65%);
}

.weapons-container{
    position: fixed;
    top:0; left:0;
    height:412px;
    overflow:hidden;
    transform-origin: 0 0;
    will-change: transform;
    display:flex;
    flex-direction:column;
    z-index:1;
    color: var(--text);
}

/* TOP BAR */
.wp-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 18px;
    background: rgba(0,0,0,0.35);
    border-bottom:1px solid var(--line);
    backdrop-filter: blur(6px);
}
.wp-title{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--text);
}
.wp-back{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--text-dim);
    border-left:2px solid var(--amber);
    padding-left:10px;
    transition:color .15s ease;
}
.wp-back:hover{ color:var(--text); }

/* CATEGORY TABS */
.wp-cats{
    display:flex;
    background: linear-gradient(180deg, rgba(46,33,25,0.9) 0%, rgba(34,24,18,0.9) 100%);
    border-bottom:1px solid var(--line);
    padding:0 6px;
    overflow-x:auto;
    flex-shrink:0;
}
.wp-cat{
    display:flex; align-items:center; gap:8px;
    font-weight:600; font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text-dim);
    padding:9px 14px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
}
.wp-cat:hover{ color:var(--text); }
.wp-cat.active{ color:var(--amber); border-bottom:2px solid var(--amber-deep); }
.wp-cat svg{ width:15px; height:15px; flex-shrink:0; }

/* BODY LAYOUT */
.wp-body{
    flex:1;
    min-height:0;
    display:flex;
}

/* LEFT: weapon list for active category */
.wp-list{
    width:150px;
    min-width:150px;
    background: linear-gradient(180deg, rgba(36,24,18,0.9) 0%, rgba(26,19,16,0.9) 100%);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:6px 0;
}
.wp-item{
    padding:8px 14px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition: background .15s ease, border-color .15s ease;
}
.wp-item:hover{ background:rgba(255,255,255,0.03); }
.wp-item.active{
    background: linear-gradient(90deg, var(--maroon) 0%, rgba(107,30,30,0.12) 100%);
    border-left:3px solid var(--amber);
}
.wp-item-name{ font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--text); }
.wp-item-type{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; }

/* CENTER: showcase */
.wp-showcase{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:10px 20px;
}
.wp-showcase-name{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:26px;
    letter-spacing:.05em;
    color:var(--text);
    text-shadow: 0 0 18px rgba(245,148,60,0.25);
}
.wp-showcase-sub{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--amber);
    margin-top:2px;
    font-weight:600;
}
.wp-art{
    width:220px;
    height:80px;
    margin:12px 0 14px;
    background: linear-gradient(135deg, rgba(245,148,60,0.08), rgba(255,255,255,0.02));
    border:1px solid var(--line);
    border-radius:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-faint);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
}
.wp-stats{
    width:100%;
    max-width:320px;
    display:flex;
    flex-direction:column;
    gap:7px;
}
.wp-stat-row{ display:flex; align-items:center; gap:10px; }
.wp-stat-label{
    width:76px;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    flex-shrink:0;
}
.wp-stat-track{ flex:1; display:flex; gap:2px; height:7px; }
.wp-stat-seg{
    flex:1;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(245,148,60,0.12);
    clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
}
.wp-stat-seg.lit{ background:var(--amber); box-shadow:0 0 6px 1px rgba(245,148,60,0.5); border-color:var(--amber); }

/* EQUIP BUTTON */
.wp-equip-btn{
    margin-top:14px;
    padding:8px 26px;
    background: linear-gradient(180deg, var(--amber) 0%, var(--amber-deep) 100%);
    color:#241812;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    border:none;
    border-radius:2px;
    cursor:pointer;
    transition: transform .1s ease, filter .1s ease;
}
.wp-equip-btn:hover{ filter:brightness(1.08); }
.wp-equip-btn:active{ transform:scale(0.97); }

/* RIGHT: loadout slots */
.wp-loadout{
    width:150px;
    min-width:150px;
    background: linear-gradient(180deg, rgba(36,24,18,0.9) 0%, rgba(26,19,16,0.9) 100%);
    border-left:1px solid var(--line);
    padding:12px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.wp-loadout-title{
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:2px;
}
.wp-loadout-hint{
    font-size:9px;
    color:var(--text-faint);
    line-height:1.4;
    margin-bottom:4px;
}
.wp-slot{
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line);
    border-radius:2px;
    padding:8px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
}
.wp-slot:hover{ border-color:var(--amber-deep); }
.wp-slot.filled{ border-color:var(--amber); }
.wp-slot.selected{ background:rgba(245,148,60,0.1); }
.wp-slot-role{
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
}
.wp-slot-name{
    font-size:12px;
    font-weight:700;
    color:var(--text);
    margin-top:2px;
}
.wp-slot-name.empty{ color:var(--text-faint); font-weight:500; }

/* BOTTOM: skin carousel */
.wp-skins{
    flex-shrink:0;
    background: rgba(10,7,5,0.5);
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    overflow-x:auto;
}
.wp-skin{
    flex-shrink:0;
    width:52px; height:34px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:8px;
    color:var(--text-faint);
    letter-spacing:.04em;
    cursor:pointer;
    transition: border-color .15s ease;
}
.wp-skin:hover{ border-color:var(--amber-deep); }
.wp-skin.active{ border-color:var(--amber); box-shadow:0 0 6px rgba(245,148,60,0.35); }
</style>
</head>

<script>
/* =========================================================================
   WEAPONS PAGE SCRIPT
   -------------------------------------------------------------------------
   This file is written so you can read it top to bottom like a story.
   Every section is labelled and every function explains what it does
   and why, in plain English. Nothing here is "clever" on purpose -
   it favors clarity over short code.
   ========================================================================= */


/* =========================================================================
   SECTION 1: THE DATA
   -------------------------------------------------------------------------
   This is the "database" for this page, but it just lives in memory as
   a plain JavaScript object. Nothing here touches a real database yet.

   Structure:
     WEAPONS = {
         categoryName: [ weaponObject, weaponObject, ... ],
         categoryName: [ ... ],
     }

   Each weaponObject looks like:
     {
         name: "VULCAN-9",              <- shown as the big title
         stats: { damage: 7, ... },     <- used to draw the bar charts
         skins: ["Default", "Ashwake"]  <- shown as clickable thumbnails
                                            at the bottom of the page
     }

   The skin names (Default, Ashwake, Circuit, Dune, etc.) are NOT special
   keywords - they are just cosmetic labels made up as placeholders.
   You can rename them, add more, or remove them. Later, each one could
   point to a real image file instead of just plain text.
   ========================================================================= */

const WEAPONS = {
    rifle: [
        {
            name: "VULCAN-9",
            stats: { damage: 7, rate: 6, range: 8, mobility: 4 },
            skins: ["Default", "Ashwake", "Circuit", "Dune"]
        },
        {
            name: "PHANTOM MK.II",
            stats: { damage: 6, rate: 7, range: 7, mobility: 5 },
            skins: ["Default", "Nightglass", "Rust"]
        },
        {
            name: "RAVAGE-7",
            stats: { damage: 8, rate: 5, range: 6, mobility: 3 },
            skins: ["Default", "Ember"]
        }
    ],
    pistol: [
        {
            name: "TALON",
            stats: { damage: 5, rate: 6, range: 4, mobility: 9 },
            skins: ["Default", "Copperline"]
        },
        {
            name: "WISP-1",
            stats: { damage: 4, rate: 8, range: 3, mobility: 9 },
            skins: ["Default", "Frostbyte", "Signal"]
        }
    ],
    smg: [
        {
            name: "HORNET X",
            stats: { damage: 4, rate: 9, range: 4, mobility: 8 },
            skins: ["Default", "Wasteland"]
        },
        {
            name: "STINGRAY",
            stats: { damage: 5, rate: 8, range: 5, mobility: 7 },
            skins: ["Default", "Voltage"]
        }
    ],
    shotgun: [
        {
            name: "GRAVEDIGGER",
            stats: { damage: 9, rate: 3, range: 2, mobility: 4 },
            skins: ["Default", "Scorch"]
        }
    ],
    sniper: [
        {
            name: "LONGSHADOW",
            stats: { damage: 10, rate: 1, range: 10, mobility: 2 },
            skins: ["Default", "Permafrost"]
        }
    ]
};

/* This just controls the order the stat bars are drawn in, and gives
   each internal key (like "rate") a nicer label to display ("Fire Rate"). */
const STAT_DISPLAY_ORDER = [
    { key: "damage",   label: "Damage" },
    { key: "rate",     label: "Fire Rate" },
    { key: "range",    label: "Range" },
    { key: "mobility", label: "Mobility" }
];


/* =========================================================================
   SECTION 2: PAGE STATE
   -------------------------------------------------------------------------
   "State" just means: the few pieces of information the page needs to
   remember right now, so it knows what to draw on screen.

   We are NOT saving any of this to a database yet. If you refresh the
   page, all of this resets back to these starting values. That is
   expected for now - it is the next thing to add later (e.g. Supabase,
   or even just localStorage as a simpler first step).
   ========================================================================= */

// Which category tab is currently selected (rifle, pistol, smg, shotgun, sniper)
let currentCategory = "rifle";

// Which weapon is selected inside that category's list (0 = first weapon)
let currentWeaponIndex = 0;

// Which skin is selected for that weapon (0 = first skin, usually "Default")
let currentSkinIndex = 0;

// Which loadout slot is currently "selected" and ready to receive
// whatever weapon you press EQUIP on. Starts on "primary".
let selectedSlot = "primary";

// This holds what is actually equipped right now.
// Both start as null, which means "nothing equipped yet".
const loadout = {
    primary: null,
    secondary: null
};


/* =========================================================================
   SECTION 3: GRABBING THE HTML ELEMENTS WE NEED TO CHANGE
   -------------------------------------------------------------------------
   document.getElementById(...) and document.querySelectorAll(...) just
   find elements in the HTML above, so we can update their text, add
   CSS classes to them, or listen for clicks on them.
   ========================================================================= */

const categoryTabElements = document.querySelectorAll(".wp-cat");
const weaponListElement = document.getElementById("wpList");
const weaponNameElement = document.getElementById("wpName");
const weaponTypeElement = document.getElementById("wpType");
const statsContainerElement = document.getElementById("wpStats");
const skinsContainerElement = document.getElementById("wpSkins");
const equipButtonElement = document.getElementById("wpEquipBtn");

const slotElements = {
    primary: document.getElementById("slotPrimary"),
    secondary: document.getElementById("slotSecondary")
};


/* =========================================================================
   SECTION 4: HELPER FUNCTION - GET THE CURRENTLY SELECTED WEAPON
   -------------------------------------------------------------------------
   Several other functions need to know "which weapon object is currently
   being looked at?". Instead of repeating that lookup everywhere, we
   write it once here and call this function whenever we need the answer.
   ========================================================================= */

function getCurrentWeapon() {
    const weaponsInThisCategory = WEAPONS[currentCategory];
    return weaponsInThisCategory[currentWeaponIndex];
}


/* =========================================================================
   SECTION 5: DRAWING THE LEFT-SIDE WEAPON LIST
   -------------------------------------------------------------------------
   This looks at WEAPONS[currentCategory] and builds one clickable row
   per weapon. Clicking a row switches currentWeaponIndex and redraws
   everything.
   ========================================================================= */

function drawWeaponList() {
    // Start with an empty list every time we redraw, so we don't end up
    // with duplicate rows stacking up.
    weaponListElement.innerHTML = "";

    const weaponsInThisCategory = WEAPONS[currentCategory];

    // A normal "for" loop, so it is easy to see exactly what index (i)
    // we are on for each weapon.
    for (let i = 0; i < weaponsInThisCategory.length; i++) {
        const weapon = weaponsInThisCategory[i];

        // Create a new <div> element for this weapon's row.
        const rowElement = document.createElement("div");
        rowElement.className = "wp-item";

        // If this row is the one currently selected, give it the
        // "active" CSS class so it gets highlighted.
        if (i === currentWeaponIndex) {
            rowElement.classList.add("active");
        }

        // Fill in the text inside the row.
        rowElement.innerHTML =
            '<div class="wp-item-name">' + weapon.name + '</div>' +
            '<div class="wp-item-type">' + currentCategory + '</div>';

        // When this row is clicked: switch to this weapon and redraw.
        rowElement.addEventListener("click", function () {
            currentWeaponIndex = i;
            currentSkinIndex = 0; // reset skin choice when switching weapons
            drawEverything();
        });

        weaponListElement.appendChild(rowElement);
    }
}


/* =========================================================================
   SECTION 6: DRAWING THE CENTER SHOWCASE (name, subtitle, stat bars)
   ========================================================================= */

function drawShowcase() {
    const weapon = getCurrentWeapon();
    const skinName = weapon.skins[currentSkinIndex];

    // Update the big title and the small subtitle line.
    weaponNameElement.textContent = weapon.name;
    weaponTypeElement.textContent = currentCategory + " \u00B7 " + skinName;

    // Clear out any stat bars from the previously selected weapon.
    statsContainerElement.innerHTML = "";

    // Build one row per stat (Damage, Fire Rate, Range, Mobility).
    for (let i = 0; i < STAT_DISPLAY_ORDER.length; i++) {
        const statInfo = STAT_DISPLAY_ORDER[i];   // e.g. { key: "damage", label: "Damage" }
        const statValue = weapon.stats[statInfo.key]; // e.g. 7

        const rowElement = document.createElement("div");
        rowElement.className = "wp-stat-row";

        // Build the label on the left ("Damage").
        const labelElement = document.createElement("div");
        labelElement.className = "wp-stat-label";
        labelElement.textContent = statInfo.label;

        // Build the little bar-chart track on the right.
        // Each stat is out of 10, so we always draw 10 small segments,
        // and "light up" however many the stat value calls for.
        const trackElement = document.createElement("div");
        trackElement.className = "wp-stat-track";

        for (let segmentNumber = 0; segmentNumber < 10; segmentNumber++) {
            const segmentElement = document.createElement("div");
            segmentElement.className = "wp-stat-seg";

            if (segmentNumber < statValue) {
                segmentElement.classList.add("lit");
            }

            trackElement.appendChild(segmentElement);
        }

        rowElement.appendChild(labelElement);
        rowElement.appendChild(trackElement);
        statsContainerElement.appendChild(rowElement);
    }
}


/* =========================================================================
   SECTION 7: DRAWING THE SKIN CAROUSEL (the "Default / Ashwake / ..." row)
   -------------------------------------------------------------------------
   This is just a row of small clickable boxes, one per skin name in the
   current weapon's "skins" array. Clicking one selects it as the
   currentSkinIndex, which changes the subtitle text in the showcase.
   Nothing is equipped by clicking a skin - it is purely for preview.
   ========================================================================= */

function drawSkinCarousel() {
    skinsContainerElement.innerHTML = "";

    const weapon = getCurrentWeapon();

    for (let i = 0; i < weapon.skins.length; i++) {
        const skinName = weapon.skins[i];

        const skinBoxElement = document.createElement("div");
        skinBoxElement.className = "wp-skin";

        if (i === currentSkinIndex) {
            skinBoxElement.classList.add("active");
        }

        skinBoxElement.textContent = skinName;

        skinBoxElement.addEventListener("click", function () {
            currentSkinIndex = i;
            drawShowcase();      // subtitle text changes
            drawSkinCarousel();  // re-highlight the newly active skin box
        });

        skinsContainerElement.appendChild(skinBoxElement);
    }
}


/* =========================================================================
   SECTION 8: DRAWING THE LOADOUT PANEL (Primary / Secondary slots)
   -------------------------------------------------------------------------
   This reads the `loadout` object and the `selectedSlot` variable, and
   updates the two slot boxes on the right side of the page to match.
   ========================================================================= */

function drawLoadout() {
    // We loop over both slots ("primary" and "secondary") using the
    // same logic, instead of writing the same code twice.
    const slotNames = ["primary", "secondary"];

    for (let i = 0; i < slotNames.length; i++) {
        const role = slotNames[i];                  // "primary" or "secondary"
        const slotElement = slotElements[role];      // the <div> for that slot
        const nameElement = slotElement.querySelector(".wp-slot-name");
        const equippedWeaponName = loadout[role];    // a weapon name, or null

        // Show the weapon name if something is equipped, otherwise show "Empty".
        if (equippedWeaponName) {
            nameElement.textContent = equippedWeaponName;
            nameElement.classList.remove("empty");
            slotElement.classList.add("filled");
        } else {
            nameElement.textContent = "Empty";
            nameElement.classList.add("empty");
            slotElement.classList.remove("filled");
        }

        // Highlight whichever slot is currently "selected" (i.e. the one
        // that will receive the next weapon you press EQUIP on).
        if (role === selectedSlot) {
            slotElement.classList.add("selected");
        } else {
            slotElement.classList.remove("selected");
        }
    }
}


/* =========================================================================
   SECTION 9: ONE FUNCTION TO REDRAW THE WHOLE PAGE
   -------------------------------------------------------------------------
   Instead of remembering to call all four "draw" functions every time
   something changes, we call this one function, and it calls the rest.
   ========================================================================= */

function drawEverything() {
    drawWeaponList();
    drawShowcase();
    drawSkinCarousel();
    drawLoadout();
}


/* =========================================================================
   SECTION 10: CATEGORY TAB CLICKS (RIFLE / PISTOL / SMG / SHOTGUN / SNIPER)
   ========================================================================= */

categoryTabElements.forEach(function (tabElement) {
    tabElement.addEventListener("click", function () {

        // Remove "active" from every tab, then add it only to the one
        // that was just clicked. This is how only one tab is highlighted
        // at a time.
        categoryTabElements.forEach(function (otherTab) {
            otherTab.classList.remove("active");
        });
        tabElement.classList.add("active");

        // The category name is stored on the element itself, in
        // data-cat="rifle" (or pistol, smg, etc). Reading it here.
        currentCategory = tabElement.dataset.cat;

        // Switching category means we should reset back to the first
        // weapon and first skin in that new category.
        currentWeaponIndex = 0;
        currentSkinIndex = 0;

        drawEverything();
    });
});


/* =========================================================================
   SECTION 11: CLICKING A LOADOUT SLOT SELECTS IT
   -------------------------------------------------------------------------
   Clicking Primary or Secondary does NOT equip or clear anything by
   itself - it just marks that slot as the "target" for the next time
   you press the EQUIP button. This makes the equip flow explicit and
   predictable instead of guessing which slot you meant.
   ========================================================================= */

slotElements.primary.addEventListener("click", function () {
    selectedSlot = "primary";
    drawLoadout();
});

slotElements.secondary.addEventListener("click", function () {
    selectedSlot = "secondary";
    drawLoadout();
});


/* =========================================================================
   SECTION 12: THE EQUIP BUTTON
   -------------------------------------------------------------------------
   Pressing EQUIP takes whatever weapon is currently shown in the
   showcase, and places its name into whichever slot is currently
   selected (highlighted) in the loadout panel.
   ========================================================================= */

equipButtonElement.addEventListener("click", function () {
    const weapon = getCurrentWeapon();
    loadout[selectedSlot] = weapon.name;
    drawLoadout();
});


/* =========================================================================
   SECTION 13: BACK BUTTON
   -------------------------------------------------------------------------
   Sends the player back to the lobby page. Change "lobby.html" here if
   your lobby file lives at a different path.
   ========================================================================= */

document.getElementById("wpBack").addEventListener("click", function () {
    window.location.href = "../lobby.html";
});


/* =========================================================================
   SECTION 14: SCALE-TO-FIT (makes the fixed-size page fit any screen)
   -------------------------------------------------------------------------
   This page is designed at a fixed height of 412 pixels. This function
   stretches/shrinks it with a CSS "transform: scale(...)" so it always
   fills the real screen, no matter the device.

   This is the exact same technique used in lobby.js. If you ever see
   TWO functions with the same name in one file (like the bug we fixed
   earlier), rename one of them - the second one silently overwrites
   the first, which caused that earlier "Cannot access before
   initialization" crash.
   ========================================================================= */

const WEAPONS_PAGE_DESIGN_HEIGHT = 412;
const weaponsContainerElement = document.getElementById("weaponsContainer");

function resizeWeaponsPage() {
    if (!weaponsContainerElement) {
        return; // safety check: don't crash if the element is missing
    }

    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    // Figure out how much bigger/smaller the real screen is compared
    // to our fixed 412px design height.
    const scaleAmount = viewportHeight / WEAPONS_PAGE_DESIGN_HEIGHT;

    // Because we are scaling everything uniformly, the width also needs
    // to be adjusted so the design still reaches the edges of the screen.
    const scaledWidth = viewportWidth / scaleAmount;

    weaponsContainerElement.style.width = scaledWidth + "px";
    weaponsContainerElement.style.height = WEAPONS_PAGE_DESIGN_HEIGHT + "px";
    weaponsContainerElement.style.transform = "scale(" + scaleAmount + ")";
}

// Run it once immediately so the page is sized correctly on load...
resizeWeaponsPage();
// ...and then again any time the window resizes or the device rotates.
window.addEventListener("resize", resizeWeaponsPage);
screen.orientation?.addEventListener("change", resizeWeaponsPage);


/* =========================================================================
   SECTION 15: FIRST DRAW
   -------------------------------------------------------------------------
   Everything above this point only DEFINED functions and set up click
   listeners - none of it actually draws anything on screen yet. These
   two lines are what actually paint the initial page the first time
   it loads.
   ========================================================================= */

drawEverything();
drawLoadout();
</script>
</body>
</html>
