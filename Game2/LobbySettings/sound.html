<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sound</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171310;
    --panel: rgba(36, 24, 18, 0.9);
    --panel-2: rgba(46, 33, 25, 0.92);
    --line: #4A2F22;
    --maroon: #6B1E1E;
    --amber: #F5943C;
    --amber-deep: #D9702A;
    --text: #F3E9DD;
    --text-dim: #B99C85;
    --text-faint: #7A5F4E;
    --track: #3A2A20;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(ellipse at 30% 0%, #3a2416 0%, transparent 55%), var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .scroll-area{
    flex:1;
    overflow-y:auto;
    padding: 6px 14px 0;
  }

  .group-title{
    display:flex;
    align-items:center;
    gap: 8px;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-size: 12px;
    color: var(--text);
    padding: 10px 0 6px;
  }
  .group-title::before{
    content:"";
    width: 3px;
    height: 13px;
    background: var(--amber);
    display:inline-block;
  }

  .row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 9px 4px;
    border-bottom: 1px solid rgba(74,47,34,0.5);
    transition: background .15s ease;
  }
  .row:hover{ background: rgba(245,148,60,0.05); }
  .row-label{
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .help-badge{
    width: 14px; height: 14px;
    min-width:14px;
    border-radius: 50%;
    border: 1px solid var(--text-faint);
    color: var(--text-faint);
    font-size: 9px;
    display:flex; align-items:center; justify-content:center;
    cursor: default;
  }

  .slider-control{
    display:flex;
    align-items:center;
    gap: 8px;
    width: 340px;
    max-width: 55%;
  }
  .slider-value{
    width: 26px;
    min-width: 26px;
    text-align:center;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 13px;
    color: var(--amber);
  }
  .step-btn{
    width: 20px; height: 20px;
    min-width: 20px;
    border-radius: 3px;
    border: none;
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .step-btn:hover{ background: var(--maroon); color: var(--text); }
  .step-btn:active{ transform: scale(0.92); }

  .slider-track-wrap{
    flex: 1;
    position: relative;
    height: 18px;
    display: flex;
    align-items: center;
  }
  input[type="range"]{
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height: 4px; background: var(--track); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 13px; height: 13px;
    margin-top: -4.5px;
    background: var(--text);
    border: 2px solid var(--amber);
    border-radius: 2px;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track{ height: 4px; background: var(--track); border-radius: 2px; }
  input[type="range"]::-moz-range-thumb{
    width: 11px; height: 11px;
    background: var(--text);
    border: 2px solid var(--amber);
    border-radius: 2px;
    cursor: pointer;
  }
  .slider-fill{
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    height: 4px;
    background: linear-gradient(90deg, var(--amber-deep), var(--amber));
    border-radius: 2px;
    pointer-events: none;
  }

  .toggle-control{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .toggle{
    display:flex;
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 12px;
    letter-spacing:.03em;
  }
  .toggle button{
    border:none;
    background: var(--panel-2);
    color: var(--text-dim);
    padding: 6px 18px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .toggle button.selected{
    background: var(--amber);
    color: #241812;
  }
  .toggle-dropdown{
    width: 22px; height: 28px;
    display:flex; align-items:center; justify-content:center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: none;
    color: var(--text-dim);
    cursor:pointer;
  }

  .foot{
    display:flex;
    justify-content:flex-end;
    padding: 10px 14px;
  }
  .quick-messages-btn{
    display:flex;
    align-items:center;
    gap: 8px;
    background: linear-gradient(180deg, var(--amber) 0%, var(--amber-deep) 100%);
    color: #241812;
    border: none;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size: 12px;
    padding: 9px 18px;
    border-radius: 3px;
    cursor:pointer;
    transition: filter .15s ease, transform .1s ease;
  }
  .quick-messages-btn:hover{ filter: brightness(1.08); }
  .quick-messages-btn:active{ transform: scale(0.97); }
  .quick-messages-btn svg{ width: 16px; height: 16px; }

  ::-webkit-scrollbar{ width: 6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }
</style>
</head>
<body>

  <div class="scroll-area">
    <div class="group-title">Game Audio</div>

    <div class="row" data-type="slider" data-key="music" data-label="Music" data-value="80"></div>
    <div class="row" data-type="slider" data-key="sfx" data-label="Sound Effects" data-value="80"></div>
    <div class="row" data-type="slider" data-key="killstreak" data-label="Kill Streak Notification" data-value="80"></div>
    <div class="row" data-type="toggle" data-key="charVoices" data-label="Character Voices" data-value="on"></div>
    <div class="row" data-type="toggle" data-key="emoteOnly" data-label="Play my emote's sounds only" data-value="on"></div>

    <div class="group-title">Voice Chat</div>

    <div class="row" data-type="toggle" data-key="pushToTalk" data-label="Push to Talk" data-value="on" data-help="1" data-dropdown="1"></div>
    <div class="row" data-type="slider" data-key="voice" data-label="Voice" data-value="80"></div>
  </div>

  <div class="foot">
    <button class="quick-messages-btn" id="quickMessages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      Quick Messages
    </button>
  </div>

<script>
  const MIN = 0, MAX = 100;

  function buildSliderRow(row){
    const key = row.dataset.key;
    const label = row.dataset.label;
    const value = parseInt(row.dataset.value, 10);

    row.innerHTML = `
      <div class="row-label">${label}</div>
      <div class="slider-control">
        <div class="slider-value" id="val-${key}">${value}</div>
        <button class="step-btn" data-key="${key}" data-dir="-1" aria-label="Decrease ${label}">&minus;</button>
        <div class="slider-track-wrap">
          <div class="slider-fill" id="fill-${key}"></div>
          <input type="range" min="${MIN}" max="${MAX}" value="${value}" id="range-${key}" data-key="${key}">
        </div>
        <button class="step-btn" data-key="${key}" data-dir="1" aria-label="Increase ${label}">+</button>
      </div>
    `;
  }

  function buildToggleRow(row){
    const key = row.dataset.key;
    const label = row.dataset.label;
    const value = row.dataset.value;
    const help = row.dataset.help ? `<span class="help-badge">?</span>` : '';
    const dropdown = row.dataset.dropdown ? `
      <div class="toggle-dropdown">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>` : '';

    row.innerHTML = `
      <div class="row-label">${label}${help}</div>
      <div class="toggle-control">
        <div class="toggle" data-key="${key}">
          <button data-state="off" class="${value === 'off' ? 'selected' : ''}">Off</button>
          <button data-state="on" class="${value === 'on' ? 'selected' : ''}">On</button>
        </div>
        ${dropdown}
      </div>
    `;
  }

  document.querySelectorAll('.row').forEach(row => {
    if (row.dataset.type === 'slider') buildSliderRow(row);
    else if (row.dataset.type === 'toggle') buildToggleRow(row);
  });

  function setValue(key, value){
    value = Math.max(MIN, Math.min(MAX, value));
    const rangeEl = document.getElementById(`range-${key}`);
    const valEl = document.getElementById(`val-${key}`);
    const fillEl = document.getElementById(`fill-${key}`);
    if (!rangeEl) return;
    rangeEl.value = value;
    valEl.textContent = value;
    fillEl.style.width = `${(value / MAX) * 100}%`;
  }

  document.addEventListener('input', (e) => {
    if (e.target.matches('input[type="range"]')){
      setValue(e.target.dataset.key, parseInt(e.target.value, 10));
    }
  });

  document.addEventListener('click', (e) => {
    const stepBtn = e.target.closest('.step-btn');
    if (stepBtn){
      const key = stepBtn.dataset.key;
      const dir = parseInt(stepBtn.dataset.dir, 10);
      const current = parseInt(document.getElementById(`range-${key}`).value, 10);
      setValue(key, current + dir * 5);
      return;
    }

    const toggleBtn = e.target.closest('.toggle button');
    if (toggleBtn){
      const toggle = toggleBtn.closest('.toggle');
      toggle.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
      toggleBtn.classList.add('selected');
    }
  });

  document.getElementById('quickMessages').addEventListener('click', () => {
    console.log('Quick Messages clicked');
  });
</script>
</body>
</html>
