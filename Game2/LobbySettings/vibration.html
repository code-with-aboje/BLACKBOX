<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vibration</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171310; --text:#F3E9DD; --text-dim:#B99C85; --amber:#F5943C; --line:#4A2F22;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(ellipse at 30% 0%, #3a2416 0%, transparent 55%), var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
  }
  h1{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--amber);
    font-size: 18px;
  }
  p{ color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
  <h1>Vibration</h1>
  <p>COMING SOON.</p>
</body>
</html>
