<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackBox — The Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #040605;
    --panel: #0a0f0c;
    --panel-raised: #0d1410;
    --line: #152019;
    --phosphor: #39ff8f;
    --phosphor-dim: #1c6b42;
    --phosphor-glow: rgba(57, 255, 143, 0.35);
    --text: #dcece2;
    --muted: #6d8177;
    --danger: #ff4d6d;
    --amber: #ffb454;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { overscroll-behavior: none; touch-action: pan-y; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(57,255,143,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,143,0.035) 1px, transparent 1px),
      #0a0a0a;
    background-size: 34px 34px, 34px 34px, auto;
  }

  .bg-grid::after {
    content: "";
    position: absolute;
    inset: -20% 0;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(57,255,143,0.05) 45%,
      rgba(57,255,143,0.09) 50%,
      rgba(57,255,143,0.05) 55%,
      transparent 100%
    );
    height: 40%;
    animation: scan-sweep 9s linear infinite;
    opacity: 0.5;
  }

  @keyframes scan-sweep {
    0%   { transform: translateY(-60%); }
    100% { transform: translateY(240%); }
  }

  .stage {
    opacity: 0;
    animation: stage-in 0.9s ease forwards;
    animation-delay: 0.05s;
  }

  @keyframes stage-in {
    0%   { opacity: 0; transform: scale(0.985); filter: blur(2px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    padding: 22px 22px 130px;
    display: flex;
    flex-direction: column;
  }

  .hub-area {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin-top: 0;
  }

  .spokes {
    position: relative;
    width: min(520px, 92vw);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
  }

  svg.connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease 0.15s;
  }
  svg.connectors line {
    stroke: var(--line);
    stroke-width: 2;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  svg.connectors line.active { stroke: url(#connectorFill); }
  svg.connectors circle.node {
    fill: var(--line);
    transition: fill 0.3s ease;
  }
  svg.connectors circle.node.active {
    fill: var(--phosphor);
    filter: drop-shadow(0 0 3px var(--phosphor-glow));
  }
  .spokes.expanded svg.connectors { opacity: 1; }

  .hub-btn {
    position: relative;
    z-index: 3;
    width: 92px; height: 92px;
    border-radius: 50%;
    border: 3px solid #2a2f2c;
    background: radial-gradient(circle at 35% 30%, #1a221c, #060907 70%);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--text);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .hub-btn::before {
    content: "";
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #d9d9d9;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.35);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .hub-btn.spinning {
    border-color: var(--phosphor);
    box-shadow: 0 0 26px var(--phosphor-glow);
  }
  .hub-btn.spinning::before {
    background: var(--phosphor);
    box-shadow: 0 0 18px var(--phosphor-glow);
  }
  .hub-btn.spinning .ring { animation: spin 1.1s linear infinite; }

  .hub-btn:not(.spinning) {
    animation: hub-breathe 3.2s ease-in-out infinite;
  }

  .ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px dashed var(--phosphor-dim);
    opacity: 0.6;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes hub-breathe {
    0%, 100% { box-shadow: 0 0 0 rgba(57,255,143,0); border-color: #2a2f2c; }
    50%      { box-shadow: 0 0 22px rgba(57,255,143,0.18); border-color: #3a4a3f; }
  }

  .spoke {
    position: absolute;
    z-index: 3;
    top: 50%;
    left: 50%;
    margin: -23px 0 0 -64px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 128px;
    height: 46px;
    border: 2px solid #2a2f2c;
    border-radius: 999px;
    background: var(--panel-raised);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.72em;
    letter-spacing: 1.5px;
    cursor: pointer;
    text-decoration: none;
    opacity: 0;
    pointer-events: none;
    transform: translate(0, 0) rotate(0deg) scale(0.25);
    transition: transform 0.55s cubic-bezier(.2,.9,.25,1.3), opacity 0.35s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }
  .spoke:hover, .spoke:focus-visible {
    border-color: var(--phosphor);
    color: var(--phosphor);
    box-shadow: 0 0 16px rgba(57,255,143,0.15);
    animation: spoke-flicker 1.6s steps(1) infinite;
  }

  @keyframes spoke-flicker {
    0%, 100% { opacity: 1; }
    92%      { opacity: 1; }
    93%      { opacity: 0.75; }
    94%      { opacity: 1; }
    97%      { opacity: 0.85; }
    98%      { opacity: 1; }
  }

  .spoke:hover .dot, .spoke:focus-visible .dot {
    animation: dot-pulse 1s ease-in-out infinite;
  }

  @keyframes dot-pulse {
    0%, 100% { box-shadow: 0 0 6px var(--phosphor); opacity: 0.85; }
    50%      { box-shadow: 0 0 12px var(--phosphor); opacity: 1; }
  }

  .spoke--stats      { --tx: -150px; --ty: -140px; --rot: -24deg; }
  .spoke--tournament { --tx: 150px;  --ty: -140px; --rot: 24deg; }
  .spoke--earn       { --tx: -150px; --ty: 140px;  --rot: 24deg; }
  .spoke--redeem     { --tx: 150px;  --ty: 140px;  --rot: -24deg; }

  .spokes.expanded .spoke {
    opacity: 1;
    pointer-events: auto;
    transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1);
  }
  .spokes.expanded .spoke:hover,
  .spokes.expanded .spoke:focus-visible {
    transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.04);
  }

  .spokes.expanded .spoke--stats      { transition-delay: 0.02s; }
  .spokes.expanded .spoke--tournament { transition-delay: 0.07s; }
  .spokes.expanded .spoke--earn       { transition-delay: 0.12s; }
  .spokes.expanded .spoke--redeem     { transition-delay: 0.17s; }

  .spoke .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--phosphor);
    box-shadow: 0 0 6px var(--phosphor);
    margin-right: 8px;
    flex-shrink: 0;
    opacity: 0.85;
  }

  /* ALEX ORBITING ROBOT */
  .alex-orbit-track {
    position: absolute;
    z-index: 4;
    top: 50%; left: 50%;
    width: 0; height: 0;
    pointer-events: none;
  }

  .alex-bot {
    position: absolute;
    top: -24px; left: -24px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1a2920, #08100c);
    border: 2px solid var(--phosphor);
    box-shadow: 0 0 12px var(--phosphor-glow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.05s linear;
  }

  /* Robot visor & glowing white eyes */
  .alex-visor {
    width: 28px; height: 12px;
    background: #020403;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    border: 1px solid var(--phosphor-dim);
  }

  .alex-eye {
    width: 5px; height: 5px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 6px #ffffff, 0 0 10px rgba(255,255,255,0.8);
    animation: alex-blink 4s ease-in-out infinite;
  }

  @keyframes alex-blink {
    0%, 96%, 100% { transform: scaleY(1); }
    98%           { transform: scaleY(0.1); }
  }

  /* Alex speech bubble attached to the orbiting robot */
  .alex-bubble {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: #0a0f0c;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 0.78em;
    padding: 8px 12px;
    border-radius: 12px;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  .alex-bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    margin-left: -6px;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid var(--text);
  }
  .alex-bubble.hidden { opacity: 0; pointer-events: none; }

  .alex-dismiss {
    margin-left: 8px;
    background: transparent;
    border: none;
    color: #0a0f0c;
    font-weight: bold;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 88px;
    transform: translate(-50%, 12px);
    z-index: 30;
    background: var(--panel-raised);
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor);
    font-size: 0.72em;
    letter-spacing: 1px;
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .toast .cursor {
    display: inline-block;
    margin-left: 2px;
    animation: cursor-blink 0.9s steps(1) infinite;
  }
  @keyframes cursor-blink {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @media (max-width: 560px) {
    .spoke { width: 104px; margin-left: -52px; font-size: 0.62em; }
    .spoke--stats      { --tx: -110px; --ty: -105px; }
    .spoke--tournament { --tx: 110px;  --ty: -105px; }
    .spoke--earn       { --tx: -110px; --ty: 105px; }
    .spoke--redeem     { --tx: 110px;  --ty: 105px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hub-btn.spinning .ring { animation: none; }
    .hub-btn:not(.spinning) { animation: none; }
    .bg-grid::after { animation: none; opacity: 0.25; }
    .stage { animation: none; opacity: 1; }
    .spoke:hover, .spoke:focus-visible { animation: none; }
    .spoke:hover .dot, .spoke:focus-visible .dot { animation: none; }
    .toast .cursor { animation: none; }
    .alex-eye { animation: none; }
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="stage">

    <div class="hub-area">
      <div class="spokes" id="spokes">
        <svg class="connectors" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="connectorFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--phosphor-dim)"></stop>
              <stop offset="100%" stop-color="var(--phosphor)"></stop>
            </linearGradient>
          </defs>
          <line id="ln-stats" x1="50" y1="50" x2="21.15" y2="23.08"></line>
          <line id="ln-tournament" x1="50" y1="50" x2="78.85" y2="23.08"></line>
          <line id="ln-earn" x1="50" y1="50" x2="21.15" y2="76.92"></line>
          <line id="ln-redeem" x1="50" y1="50" x2="78.85" y2="76.92"></line>
          <circle class="node" cx="50" cy="50" r="1.6"></circle>
          <circle id="nd-stats" class="node" cx="21.15" cy="23.08" r="1.4"></circle>
          <circle id="nd-tournament" class="node" cx="78.85" cy="23.08" r="1.4"></circle>
          <circle id="nd-earn" class="node" cx="21.15" cy="76.92" r="1.4"></circle>
          <circle id="nd-redeem" class="node" cx="78.85" cy="76.92" r="1.4"></circle>
        </svg>

        <button class="spoke spoke--stats" type="button" data-action="stats"><span class="dot"></span>STATS</button>
        <button class="spoke spoke--tournament" type="button" data-action="tournament"><span class="dot"></span>TOURNAMENT</button>
        <button class="spoke spoke--earn" type="button" data-action="earn"><span class="dot"></span>EARN</button>
        <button class="spoke spoke--redeem" type="button" data-action="redeem"><span class="dot"></span>REDEEM</button>

        <button class="hub-btn" id="hubBtn" type="button" aria-label="Spin the Grid">
          <span class="ring"></span>
        </button>

        <!-- ORBITING ROBOT ALEX -->
        <div class="alex-orbit-track">
          <div class="alex-bot" id="alexBot">
            <div class="alex-visor">
              <div class="alex-eye"></div>
              <div class="alex-eye"></div>
            </div>
            <div class="alex-bubble" id="alexBubble">
               &nbsp &nbsp RAVEN
              <button class="alex-dismiss" id="alexDismiss" aria-label="Dismiss"></button>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

<script>
  const KEY = 'grid_state_v1';
  const state = JSON.parse(localStorage.getItem(KEY) || '{}');
  state.alexDismissed = state.alexDismissed || false;
  localStorage.setItem(KEY, JSON.stringify(state));

  const alexBubble = document.getElementById('alexBubble');
  const dismissBtn = document.getElementById('alexDismiss');
  if (state.alexDismissed) alexBubble.classList.add('hidden');

  dismissBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    alexBubble.classList.add('hidden');
    state.alexDismissed = true;
    localStorage.setItem(KEY, JSON.stringify(state));
  });

  /* Alex circular orbit animation */
  const alexBot = document.getElementById('alexBot');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let angle = 0;
  
  function animateOrbit() {
    if (!prefersReducedMotion) {
      angle += 0.008; // Orbit speed
      const radius = 100; // Orbit distance from center hub
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      alexBot.style.transform = `translate(${x}px, ${y}px)`;
    }
    requestAnimationFrame(animateOrbit);
  }
  requestAnimationFrame(animateOrbit);

  const hubBtn = document.getElementById('hubBtn');
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg) {
    toast.innerHTML = msg + '<span class="cursor">_</span>';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  const spokesEl = document.getElementById('spokes');

  hubBtn.addEventListener('click', () => {
    const expanding = !spokesEl.classList.contains('expanded');
    spokesEl.classList.toggle('expanded', expanding);
    hubBtn.classList.toggle('spinning', expanding);
    document.querySelectorAll('svg.connectors line').forEach(l => l.classList.toggle('active', expanding));
    document.querySelectorAll('svg.connectors circle.node').forEach(c => c.classList.toggle('active', expanding));
    if (expanding) showToast('CHOOSE A LANE');
  });

  document.addEventListener('click', (e) => {
    if (!spokesEl.contains(e.target)) {
      spokesEl.classList.remove('expanded');
      hubBtn.classList.remove('spinning');
      document.querySelectorAll('svg.connectors line').forEach(l => l.classList.remove('active'));
      document.querySelectorAll('svg.connectors circle.node').forEach(c => c.classList.remove('active'));
    }
  });

  const routes = {
    stats: 'Opening STATS…',
    tournament: 'Opening TOURNAMENT…',
    earn: 'Opening EARN…',
    redeem: 'Opening REDEEM…'
  };

  document.querySelectorAll('.spoke').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      showToast(routes[action] || 'Loading…');
    });
  });
</script>

</body>
</html>
