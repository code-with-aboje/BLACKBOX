<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - BlackBox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #000000;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
      max-width: 560px;
      width: 100%;
    }

    .tool-card {
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .tool-card:hover {
      transform: translateY(-4px);
      border-color: #ffffff;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .tool-thumb {
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: #111111;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .tool-body {
      padding: 16px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .tool-name {
      color: #ffffff;
      font-size: 1em;
      font-weight: 700;
      line-height: 1.3;
    }
    .tool-creator {
      color: #7a7a7a;
      font-size: 0.8em;
      font-weight: 500;
    }
    .tool-creator span { color: #bbbbbb; }

    .tool-downloads {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #777;
      font-size: 0.78em;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .tool-downloads svg { width: 13px; height: 13px; opacity: 0.7; }

    .tool-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-price {
      font-size: 0.78em;
      font-weight: 700;
      color: #7CFFB2;
      background: rgba(124,255,178,0.08);
      border: 1px solid rgba(124,255,178,0.35);
      border-radius: 999px;
      padding: 2px 10px;
      white-space: nowrap;
    }
    .tool-price.free { color: #aaa; background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }

    .tool-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }

    .get-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #ffffff;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 0.82em;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .get-btn:hover {
      box-shadow: 0 4px 18px rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }
    .get-btn.installed {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: #888;
      cursor: default;
      box-shadow: none;
      transform: none;
    }
    .get-btn.mine {
      background: transparent;
      border: 1px solid rgba(124,255,178,0.4);
      color: #7CFFB2;
      cursor: default;
      box-shadow: none;
      transform: none;
    }
    .get-btn:disabled { opacity: 0.6; cursor: default; box-shadow: none; transform: none; }

    .info-btn {
      width: 38px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 10px;
      background: transparent;
      color: #ccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    .info-btn:hover {
      border-color: #ffffff;
      color: #fff;
      background: rgba(255,255,255,0.05);
    }
    .info-btn svg { width: 16px; height: 16px; }

    /* Details modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal-card {
      width: 100%;
      max-width: 400px;
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      padding: 28px;
      transform: scale(0.92) translateY(10px);
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
    }
    .modal-overlay.visible .modal-card { transform: scale(1) translateY(0); }
    .modal-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .modal-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; background: #111111;
      border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0;
    }
    .modal-top h2 { color: #fff; font-size: 1.1em; font-weight: 800; }
    .modal-top p { color: #888; font-size: 0.82em; margin-top: 2px; }
    .modal-desc { color: #b5b5b5; font-size: 0.88em; line-height: 1.6; margin-bottom: 20px; }
    .modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .modal-stat {
      background: #111111; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px; padding: 10px 8px; text-align: center;
    }
    .modal-stat .val { color: #fff; font-weight: 700; font-size: 0.9em; }
    .modal-stat .lbl { color: #666; font-size: 0.68em; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-close-btn {
      flex: 0 0 34%; padding: 13px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.4); background: transparent;
      color: #999; font-weight: 700; font-size: 0.82em; letter-spacing: 0.5px;
      cursor: pointer; transition: all 0.25s ease;
    }
    .modal-close-btn:hover { color: #fff; border-color: #ffffff; }
    .modal-get-btn {
      flex: 1; padding: 13px; border: 1px solid #ffffff; border-radius: 10px;
      background: #ffffff; color: #000; font-weight: 700; font-size: 0.82em;
      letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
      transition: all 0.25s ease;
    }
    .modal-get-btn:hover { box-shadow: 0 4px 18px rgba(255,255,255,0.2); }

    /* ===== REUSABLE LOADING OVERLAY (copy this block too) ===== */
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.94);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    .loading-overlay.visible { opacity: 1; pointer-events: all; }
    .loading-spinner {
      width: 42px; height: 42px; border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff; border-radius: 50%; animation: loadingSpin 0.8s linear infinite;
    }
    @keyframes loadingSpin { to { transform: rotate(360deg); } }
    .loading-text {
      margin-top: 20px; color: #aaa; font-family: 'Inter', sans-serif;
      font-size: 0.9em; font-weight: 600; letter-spacing: 1px; text-align: center;
    }
    .loading-success-icon {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid #ffffff;
      display: none; align-items: center; justify-content: center;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .loading-success-icon svg { width: 22px; height: 22px; stroke: #ffffff; }
    @keyframes popIn {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .loading-error-icon {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid #ff6b6b;
      display: none; align-items: center; justify-content: center;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .loading-error-icon svg { width: 22px; height: 22px; stroke: #ff6b6b; }
    /* ===== END REUSABLE LOADING OVERLAY ===== */

    .empty-state, .loading-state {
      color: #888;
      font-size: 0.9em;
      text-align: center;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="tool-grid" id="toolGrid"></div>

  <!-- Details modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-top">
        <div class="modal-icon" id="modalIcon">🛠</div>
        <div>
          <h2 id="modalName">Tool Name</h2>
          <p id="modalCreator">by Creator</p>
        </div>
      </div>
      <p class="modal-desc" id="modalDesc">Description goes here.</p>
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="val" id="modalDownloads">0</div>
          <div class="lbl">Downloads</div>
        </div>
        <div class="modal-stat">
          <div class="val" id="modalVersion">1.0</div>
          <div class="lbl">Version</div>
        </div>
        <div class="modal-stat">
          <div class="val" id="modalSize">-</div>
          <div class="lbl">Price</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-close-btn" id="modalCloseBtn">Close</button>
        <button class="modal-get-btn" id="modalGetBtn">Get</button>
      </div>
    </div>
  </div>

  <!-- ===== REUSABLE LOADING OVERLAY (copy this block too) ===== -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner" id="loadingSpinner"></div>
    <div class="loading-success-icon" id="loadingSuccessIcon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="loading-error-icon" id="loadingErrorIcon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <div class="loading-text" id="loadingText">Loading...</div>
  </div>
  <!-- ===== END REUSABLE LOADING OVERLAY ===== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-client.js"></script>
  <script>
    // ===== REUSABLE LOADING OVERLAY FUNCTIONS (copy this block too) =====
    function showLoadingOverlay(message = 'Loading...') {
      const overlay = document.getElementById('loadingOverlay');
      const text = document.getElementById('loadingText');
      const spinner = document.getElementById('loadingSpinner');
      const successIcon = document.getElementById('loadingSuccessIcon');
      const errorIcon = document.getElementById('loadingErrorIcon');
      if (!overlay) return;
      spinner.style.display = 'block';
      successIcon.style.display = 'none';
      errorIcon.style.display = 'none';
      if (text) text.textContent = message;
      overlay.classList.add('visible');
    }
    function showLoadingSuccess(message = 'Success!') {
      const spinner = document.getElementById('loadingSpinner');
      const successIcon = document.getElementById('loadingSuccessIcon');
      const errorIcon = document.getElementById('loadingErrorIcon');
      const text = document.getElementById('loadingText');
      spinner.style.display = 'none';
      errorIcon.style.display = 'none';
      successIcon.style.display = 'flex';
      successIcon.style.animation = 'none';
      void successIcon.offsetWidth;
      successIcon.style.animation = '';
      if (text) text.textContent = message;
    }
    function showLoadingError(message = 'Something went wrong') {
      const spinner = document.getElementById('loadingSpinner');
      const successIcon = document.getElementById('loadingSuccessIcon');
      const errorIcon = document.getElementById('loadingErrorIcon');
      const text = document.getElementById('loadingText');
      spinner.style.display = 'none';
      successIcon.style.display = 'none';
      errorIcon.style.display = 'flex';
      errorIcon.style.animation = 'none';
      void errorIcon.offsetWidth;
      errorIcon.style.animation = '';
      if (text) text.textContent = message;
    }
    function hideLoadingOverlay() {
      const overlay = document.getElementById('loadingOverlay');
      if (!overlay) return;
      overlay.classList.remove('visible');
    }
    // ===== END REUSABLE LOADING OVERLAY FUNCTIONS =====

    let currentUser = null;
    const toolGrid = document.getElementById('toolGrid');
    let tools = [];

    function formatDownloads(n) {
      if (n >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k';
      return n.toString();
    }

    function formatPrice(p) {
      return p > 0 ? `${p.toLocaleString()} tokens` : 'Free';
    }

    function notifyTokensChanged() {
      // Homepage header lives one level up (outside this iframe) — ask it to refresh the balance readout.
      try { window.parent.postMessage({ type: 'bb-tokens-changed' }, '*'); } catch (e) { /* ignore */ }
    }

    function renderTools() {
      toolGrid.innerHTML = '';
      if (tools.length === 0) {
        toolGrid.innerHTML = '<p class="empty-state">No tools published yet. Be the first — head to Uploads.</p>';
        return;
      }
      tools.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        const priceLabel = formatPrice(tool.price_tokens);
        const priceClass = tool.price_tokens > 0 ? '' : 'free';

        let actionHtml;
        if (tool.is_mine) {
          actionHtml = tool.tool_url
            ? `<button class="get-btn" data-open-id="${tool.id}">Open Tool</button>`
            : `<button class="get-btn mine" disabled>Your Tool</button>`;
        } else if (tool.gotten_by_me) {
          actionHtml = tool.tool_url
            ? `<button class="get-btn" data-open-id="${tool.id}">Open Tool</button>`
            : `<button class="get-btn installed" disabled>Got it</button>`;
        } else {
          actionHtml = `<button class="get-btn" data-id="${tool.id}">Get</button>`;
        }

        const thumbInner = tool.icon_image
          ? `<img src="${tool.icon_image}" alt="${tool.name}" style="width:100%;height:100%;object-fit:contain;">`
          : tool.icon;

        card.innerHTML = `
          <div class="tool-thumb">${thumbInner}</div>
          <div class="tool-body">
            <div class="tool-name">${tool.name}</div>
            <div class="tool-creator">by <span>${tool.creator_username}</span></div>
            <div class="tool-meta-row">
              <div class="tool-downloads">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                ${formatDownloads(tool.downloads)}
              </div>
              <span class="tool-price ${priceClass}">${priceLabel}</span>
            </div>
            <div class="tool-actions">
              ${actionHtml}
              <button class="info-btn" data-id="${tool.id}" aria-label="Info">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="16" x2="12" y2="12"/>
                  <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
              </button>
            </div>
          </div>
        `;
        toolGrid.appendChild(card);
      });
    }

    async function loadTools() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        toolGrid.innerHTML = '<p class="empty-state">Not logged in.</p>';
        return;
      }
      currentUser = session.user;

      toolGrid.innerHTML = '<p class="loading-state">Loading tools...</p>';
      try {
        const { data, error } = await supabaseClient.rpc('list_market_tools');
        if (error) {
          toolGrid.innerHTML = `<p class="empty-state">${error.message || 'Could not load tools'}</p>`;
          return;
        }
        tools = data;
        renderTools();
      } catch (e) {
        toolGrid.innerHTML = '<p class="empty-state">Network error.</p>';
      }
    }

    async function getTool(id, btnEl) {
      const tool = tools.find(t => t.id === Number(id));
      if (!tool) return;

      showLoadingOverlay(`Getting ${tool.name}...`);
      if (btnEl) btnEl.disabled = true;

      try {
        const { data, error } = await supabaseClient.rpc('redeem_tool', { p_tool_id: tool.id });

        if (error) {
          showLoadingError(error.message || 'Could not complete purchase');
          setTimeout(hideLoadingOverlay, 1400);
          if (btnEl) btnEl.disabled = false;
          return;
        }

        showLoadingSuccess(data.already_owned ? 'Already owned' : 'Got it!');
        tool.gotten_by_me = true;
        tool.downloads = data.downloads;
        tool.tool_url = data.tool_url;
        notifyTokensChanged();

        setTimeout(() => {
          hideLoadingOverlay();
          renderTools();
          if (data.tool_url) {
            window.open(data.tool_url, '_blank', 'noopener');
          }
        }, 900);

      } catch (e) {
        showLoadingError('Network error');
        setTimeout(hideLoadingOverlay, 1400);
        if (btnEl) btnEl.disabled = false;
      }
    }

    toolGrid.addEventListener('click', (e) => {
      const openBtn = e.target.closest('.get-btn[data-open-id]');
      const getBtn = e.target.closest('.get-btn[data-id]:not([disabled])');
      const infoBtn = e.target.closest('.info-btn');
      if (openBtn) {
        const tool = tools.find(t => t.id === Number(openBtn.dataset.openId));
        if (tool && tool.tool_url) window.open(tool.tool_url, '_blank', 'noopener');
        return;
      }
      if (getBtn) getTool(getBtn.dataset.id, getBtn);
      if (infoBtn) openModal(infoBtn.dataset.id);
    });

    const modalOverlay = document.getElementById('modalOverlay');
    let activeModalToolId = null;

    function openModal(id) {
      const tool = tools.find(t => t.id === Number(id));
      if (!tool) return;
      activeModalToolId = tool.id;
      const modalIconEl = document.getElementById('modalIcon');
      modalIconEl.innerHTML = tool.icon_image
        ? `<img src="${tool.icon_image}" alt="${tool.name}" style="width:100%;height:100%;object-fit:contain;border-radius:14px;">`
        : tool.icon;
      document.getElementById('modalName').textContent = tool.name;
      document.getElementById('modalCreator').textContent = `by ${tool.creator_username}`;
      document.getElementById('modalDesc').textContent = tool.description;
      document.getElementById('modalDownloads').textContent = formatDownloads(tool.downloads);
      document.getElementById('modalVersion').textContent = tool.version;
      document.getElementById('modalSize').textContent = formatPrice(tool.price_tokens);

      const modalGetBtn = document.getElementById('modalGetBtn');
      if (tool.is_mine || tool.gotten_by_me) {
        if (tool.tool_url) {
          modalGetBtn.textContent = 'Open Tool';
          modalGetBtn.disabled = false;
        } else {
          modalGetBtn.textContent = tool.is_mine ? 'Your Tool' : 'Got it';
          modalGetBtn.disabled = true;
        }
      } else {
        modalGetBtn.textContent = 'Get';
        modalGetBtn.disabled = false;
      }

      modalOverlay.classList.add('visible');
    }

    function closeModal() {
      modalOverlay.classList.remove('visible');
      activeModalToolId = null;
    }

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.getElementById('modalGetBtn').addEventListener('click', () => {
      if (activeModalToolId == null) return;
      const tool = tools.find(t => t.id === Number(activeModalToolId));
      if (tool && (tool.is_mine || tool.gotten_by_me) && tool.tool_url) {
        window.open(tool.tool_url, '_blank', 'noopener');
        closeModal();
        return;
      }
      const cardBtn = document.querySelector(`.get-btn[data-id="${activeModalToolId}"]`);
      closeModal();
      getTool(activeModalToolId, cardBtn);
    });

    loadTools();
  </script>
</body>
</html>
