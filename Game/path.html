<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="mode-stat">
        <div class="rank">

        </div>
        <div class="mode">
        </div>
    </div>
    

    <style>
        .mode-stat{
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .rank{
            background: black;
            height: 70px;
            width: 50px;
            border-radius: 12px;
        }
        
        .mode{
            background: black;
            height: 70px;
            width: 200px;

            clip-path: polygon(
            7% 0,
            93% 0,
            100% 25%,
            100% 75%,
            93% 100%,
            7% 100%,
            0 75%,
            0 25%
    );
        }

    </style>
</body>
</html>
